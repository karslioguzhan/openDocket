services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opendocket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opendocket}
      POSTGRES_DB: opendocket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendocket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://opendocket:${POSTGRES_PASSWORD:-opendocket}@postgres:5432/opendocket
      SECRET: ${SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FILE_STORAGE_DIR: /data/files
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_CREATE_TABLES: "false"
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - filedata:/data/files
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  filedata:

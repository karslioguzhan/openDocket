[project]
name = "opendocket-backend"
version = "0.1.0"
description = "openDocket — self-hostable personal contract manager (backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
